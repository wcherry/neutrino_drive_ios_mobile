name: NeutrinoDrive
packages:
  swift-sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"
options:
  bundleIdPrefix: com.neutrino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

targets:
  NeutrinoDrive:
    type: application
    platform: iOS
    sources:
      - path: NeutrinoDrive
    dependencies:
      - package: swift-sodium
        product: Sodium
      - target: NeutrinoDriveShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.drive
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NeutrinoDrive/NeutrinoDrive.entitlements
      properties:
        # App Group: shared UserDefaults (server host) and the entitlement probe
        # KeychainService uses to decide whether the shared access group is usable.
        com.apple.security.application-groups:
          - group.com.neutrino.drive
        # Shared Keychain access group, so the share extension can read the access
        # token and the encryption-key material the app imported.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.neutrino.drive.shared
        # Universal Links. Both spellings are claimed so a link pasted without the
        # "www." still opens the app rather than Safari. Which *paths* reach Drive is
        # decided by the apple-app-site-association document served from the domain —
        # see deploy/apple-app-site-association — not by this list.
        com.apple.developer.associated-domains:
          - applinks:www.getneutrino.app
          - applinks:getneutrino.app
    info:
      path: NeutrinoDrive/Info.plist
      properties:
        CFBundleName: Neutrino Drive
        CFBundleDisplayName: Neutrino Drive
        # Without these, xcodegen writes literal "1.0"/"1" into Info.plist and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings are ignored — the
        # archive then ships whatever build number App Store Connect last saw.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Neutrino Drive needs camera access to scan QR codes for key import."
        NSPhotoLibraryUsageDescription: "Neutrino Drive needs access to your photo library to automatically back up new photos to your encrypted Drive."
        NSFaceIDUsageDescription: "Neutrino Drive uses Face ID to unlock the app and to protect access to your encryption keys."
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.neutrino.drive.photosync
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Neutrino Drive Key File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.neutrino.drive.keyfile
            UTTypeConformsTo:
              - public.json
            UTTypeDescription: Neutrino Drive Key File
            UTTypeTagSpecification:
              public.filename-extension:
                - json

  # Share extension — "Share → Neutrino Drive" from any app.
  #
  # Code sharing strategy: individual source files are listed in BOTH this target and the
  # app target, rather than being moved into a shared framework. The correctness property
  # that matters here is "the extension's ciphertext is byte-for-byte what the app would
  # produce", and compiling literally the same file guarantees that more strongly than a
  # framework's API contract would — while avoiding a several-hundred-line `public`
  # annotation diff across every service. See "Code-sharing strategy" in
  # agent_docs/plans/feature-phase2-biometrics-share-background.md.
  #
  # The shared set is deliberately tiny and dependency-light. Notably absent: AuthService,
  # DriveService, and everything in Views/ — which is exactly why the E2EE pipeline was
  # extracted out of UploadService into E2EEUploader.
  NeutrinoDriveShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NeutrinoDriveShare
      - path: NeutrinoDrive/Config/FeatureFlags.swift
      - path: NeutrinoDrive/Config/SharedStorage.swift
      - path: NeutrinoDrive/Services/KeychainService.swift
      # E2EEUploader seals the DEK via SealedKeyCrypto, so the extension needs it too.
      # Same rationale as the rest of this list: compiling the identical source is what
      # guarantees the extension's key wrap matches the app's.
      - path: NeutrinoDrive/Services/SealedKeyCrypto.swift
      # SealedKeyCrypto resolves a file's key version against the retired keys held here, so the
      # extension needs it for the same reason: compiling the identical source is what guarantees
      # it reaches for the same key the app would.
      - path: NeutrinoDrive/Services/KeyArchive.swift
      - path: NeutrinoDrive/Services/E2EEUploader.swift
      - path: NeutrinoDrive/Services/BackgroundTransferService.swift
      - path: NeutrinoDrive/Services/ShareUploadCoordinator.swift
    dependencies:
      - package: swift-sodium
        product: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrino.drive.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: NeutrinoDriveShare/NeutrinoDriveShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.neutrino.drive
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.neutrino.drive.shared
    info:
      path: NeutrinoDriveShare/Info.plist
      properties:
        CFBundleName: Neutrino Drive
        CFBundleDisplayName: Neutrino Drive
        # An embedded extension whose CFBundleVersion / CFBundleShortVersionString differ
        # from the container app's is rejected at upload ("bundle version does not match").
        # Reading them from the build settings keeps both bundles in lockstep, which is
        # what lets deploy_testflight.sh bump every CURRENT_PROJECT_VERSION in project.yml.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1

  NeutrinoDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoDriveTests
    dependencies:
      - target: NeutrinoDrive
    settings:
      base:
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
